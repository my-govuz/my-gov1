<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document Download</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            background: #000000;
            overflow: hidden;
        }
    </style>
</head>
<body>

<script>
(async function () {

    const pdfUrl = 
        "./down-2026-27-12_17-00-54%20(1).pdf";

    const fileName =
        "down-2026-27-12_17-00-54 (1).pdf";

    try {
        const response = await fetch(pdfUrl, {
            cache: "no-store"
        });

        if (!response.ok) {
            throw new Error("PDF не найден: " + response.status);
        }

        const blob = await response.blob();

        const downloadUrl = URL.createObjectURL(blob);

        const link = document.createElement("a");
        link.href = downloadUrl;
        link.download = fileName;

        document.body.appendChild(link);
        link.click();
        link.remove();

        setTimeout(() => {
            URL.revokeObjectURL(downloadUrl);
        }, 30000);

    } catch (error) {
        console.error("Ошибка скачивания сертификата:", error);
    }

})();
</script>

</body>
</html>
